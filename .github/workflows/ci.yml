name: CI

on:
  push:
    branches:
      - main
      - bot/sync-workspace
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The validator needs to read every repository in the workspace, including the
      # private ones. GITHUB_TOKEN cannot: it is scoped to this repository, so it
      # sees one repository rather than every one the App is installed on.
      #
      # Minted from the App this repository already holds credentials for, rather
      # than through actions/create-github-app-token. Two reasons. That action is a
      # third-party step whose Node 20 runtime is deprecated, and it hands out a
      # token without checking that the installation covers the account -- which is
      # the one fact this check's deletion reporting depends on. This step asserts
      # coverage and mints from the same installation, so the proof and the
      # credential cannot come from different places.
      #
      # Read-only. The validator must not be able to change anything, and asking
      # for less than the App holds is a ceiling rather than a grant.
      - name: Mint installation token and assert coverage
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: node .github/scripts/mint-installation-token.ts contents=read metadata=read

      # Offline, no token needed. Guards the classification rule itself, so a
      # change to repo-index.ts cannot quietly redefine where a repository
      # belongs.
      - name: Test the classification rule
        run: node .github/scripts/test-repo-index.ts

      # This repository is a workspace index, not a package. It owns submodule
      # pointer hygiene and layout accuracy; package build, test, and release
      # validation belongs to the nested repositories.
      #
      # Pointer freshness is reported but not enforced. The bot advances pointers
      # on its own schedule, so failing here would race it and produce red builds
      # for a state that is already being fixed. This check proves the workspace is
      # well-formed: one submodule per GitHub repository, each at the path its
      # archived/private/public state requires.
      - name: Verify workspace matches the GitHub repository list
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
          UMBRELLA_ENUMERATION_COMPLETE: ${{ steps.app.outputs.complete }}
          UMBRELLA_OWNER: ${{ github.repository_owner }}
          UMBRELLA_REPO: ${{ github.event.repository.name }}
        run: node .github/scripts/verify-workspace.ts