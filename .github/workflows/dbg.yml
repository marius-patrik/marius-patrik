name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe-stack
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node --input-type=module -e '
            const m = await import("./.github/scripts/github-api.mjs");
            try { m.resolveCredential(); console.log("resolve OK"); }
            catch(e){ console.log("STACK:", e.stack.split("\n").slice(0,6).join(" || ")); }
            const v = await import("./.github/scripts/verify-workspace.mjs").catch(e=>e);
            console.log("verify threw?", v && v.message ? v.message.slice(0,80) : "no");
          ' 2>&1 | head -20
