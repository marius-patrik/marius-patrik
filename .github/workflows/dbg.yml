name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: verify-hash
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          echo "--- sha256 of checked-out file ---"
          sha256sum .github/scripts/github-api.mjs
          echo "--- sha256 computed locally for origin/main ---"
          git show origin/main:.github/scripts/github-api.mjs | sha256sum
          echo "--- does checkout have the instrumented or original? ---"
          grep -c 'CALL' .github/scripts/github-api.mjs || true
