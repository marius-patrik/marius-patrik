name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node --input-type=module -e '
            const m = await import("./.github/scripts/github-api.mjs");
            console.log("exported_names:", Object.keys(m).sort().join(","));
            console.log("toString:", m.resolveCredential.toString().slice(0,160).replace(/\n/g," "));
          '
