name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: verbatim
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir -p inst
          node -e '
            const fs=require("fs");
            let s=fs.readFileSync(".github/scripts/github-api.mjs","utf8");
            s=s.replace(
              "  const appToken = process.env.UMBRELA_APP_TOKEN?.trim();",
              "  console.error(\"VERBATIM typeof=\"+(typeof process.env.UMBRELLA_APP_TOKEN)+\" truthy=\"+(!!process.env.UMBRELLA_APP_TOKEN)+\" trimmed_len=\"+(process.env.UMBRELA_APP_TOKEN?.trim()?.length));\n  const appToken = process.env.UMBRELA_APP_TOKEN?.trim();"
            );
            fs.writeFileSync("inst/github-api.mjs",s);
            fs.copyFileSync(".github/scripts/repo-index.mjs","inst/repo-index.mjs");
            fs.copyFileSync(".github/scripts/verify-workspace.mjs","inst/verify-workspace.mjs");
          '
          node inst/verify-workspace.mjs 2>&1 | head -6
