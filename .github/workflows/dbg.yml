name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          cat > /tmp/p.mjs <<'INNER'
          console.log("len_in_mjs:", (process.env.UMBRELLA_APP_TOKEN||"MISSING").length);
          INNER
          echo 'console.log("len_via_eval:", (process.env.UMBRELLA_APP_TOKEN||"MISSING").length);' > /tmp/q.mjs
          echo "--- run /tmp/p.mjs ---"; node /tmp/p.mjs
          echo "--- run /tmp/q.mjs ---"; node /tmp/q.mjs
          echo "--- run -e ---"; node -e 'console.log("len_e:", (process.env.UMBRELLA_APP_TOKEN||"MISSING").length)'
