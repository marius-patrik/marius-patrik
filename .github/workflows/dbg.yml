name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe-internal
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          cat > /tmp/t.mjs <<'INNER'
          const seen = [];
          const realEnv = process.env;
          const proxy = new Proxy(realEnv, {
            get(t, k){ seen.push(String(k)); return t[k]; }
          });
          Object.defineProperty(process, "env", { value: proxy, configurable: true });
          const m = await import("/home/runner/work/marius-patrik/marius-patrik/.github/scripts/github-api.mjs");
          try { const c = m.resolveCredential(); console.log("OK:", c.source); }
          catch(e){ console.log("THREW after reads:", JSON.stringify([...new Set(seen)])); }
          INNER
          node /tmp/t.mjs
