name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node --input-type=module -e '
            const before = process.env.UMBRELLA_APP_TOKEN?.length;
            console.log("before_import:", before);
            const m = await import("./.github/scripts/github-api.mjs");
            const after = process.env.UMBRELLA_APP_TOKEN?.length;
            console.log("after_import:", after);
            console.log("same_value:", before === after);
            console.log("env_keys_with_token:", Object.keys(process.env).filter(k=>/TOKEN|token/i.test(k)).join(","));
          '
