name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: instrument
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir -p inst
          node -e '
            const fs=require("fs");
            let s=fs.readFileSync(".github/scripts/github-api.mjs","utf8");
            s=s.replace("export function resolveCredential() {",
              "export function resolveCredential() {\n  console.error(\"INSIDE len=\"+(process.env.UMBRELLA_APP_TOKEN||\"MISSING\").length);");
            fs.writeFileSync("inst/github-api.mjs",s);
            fs.copyFileSync(".github/scripts/repo-index.mjs","inst/repo-index.mjs");
            let v=fs.readFileSync(".github/scripts/verify-workspace.mjs","utf8");
            v=v.replace("./github-api.mjs","./github-api.mjs").replace("./repo-index.mjs","./repo-index.mjs");
            fs.writeFileSync("inst/verify-workspace.mjs",v);
          '
          node inst/verify-workspace.mjs 2>&1 | head -8
