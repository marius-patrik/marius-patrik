name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe-owners
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
          UMBRELLA_OWNER: ${{ github.repository_owner }}
          UMBRELLA_REPO: ${{ github.event.repository.name }}
        run: |
          node --input-type=module -e '
            console.log("outer_len:", (process.env.UMBRELLA_APP_TOKEN||"MISSING").length);
            const m = await import("./.github/scripts/github-api.mjs");
            console.log("inner_len:", (process.env.UMBRELLA_APP_TOKEN||"MISSING").length);
            console.log("keys:", Object.keys(process.env).filter(k=>k.startsWith("UMBRELLA")).join(","));
            console.log("descriptor_writable:", Object.getOwnPropertyDescriptor(process.env,"UMBRELLA_APP_TOKEN") ? "own-prop" : "absent");
            console.log("via_get:", process.env.UMBRELLA_APP_TOKEN === undefined ? "UNDEF" : "len:"+process.env.UMBRELLA_APP_TOKEN.length);
          '
