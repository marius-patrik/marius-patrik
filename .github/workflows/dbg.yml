name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node --input-type=module -e '
            const v = process.env.UMBRELLA_APP_TOKEN;
            console.log("typeof:", typeof v);
            console.log("raw_len:", v === undefined ? "UNDEF" : v.length);
            console.log("first4:", JSON.stringify(String(v).slice(0,4)));
            console.log("is_stars:", v === "***");
            console.log("has_newline:", /[\r\n]/.test(String(v)));
            const m = await import("./.github/scripts/github-api.mjs");
            try { console.log("resolved:", JSON.stringify({...m.resolveCredential(), token: "X"})); }
            catch(e){ console.log("resolve threw:", e.message.slice(0,60)); }
          '
