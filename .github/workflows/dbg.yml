name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: trim-probe
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node -e '
            const raw = process.env.UMBRELLA_APP_TOKEN;
            console.log("raw_len:", raw.length);
            let t;
            try { t = raw.trim(); console.log("trim_ok:", t.length); }
            catch(e){ console.log("trim_threw:", e.name, e.message.slice(0,60)); }
            console.log("falsy_after_trim:", !t);
            console.log("type:", typeof raw, "isString:", typeof raw === "string");
            console.log("has_ghs_prefix:", String(raw).slice(0,4) === "ghs_");
            console.log("trim_still_ghs:", String(t).slice(0,4) === "ghs_");
          '
