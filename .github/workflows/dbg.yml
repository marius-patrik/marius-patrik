name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run validator
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
          UMBRELLA_OWNER: ${{ github.repository_owner }}
          UMBRELLA_REPO: ${{ github.event.repository.name }}
        run: |
          node -e '
            const m = await import("./.github/scripts/github-api.mjs");
            const c = m.resolveCredential();
            console.log("credential source:", c.source, "len:", c.token.length);
            const {repos, source} = await m.listRepos();
            console.log("listRepos:", source, repos.length);
          ' --input-type=module
