name: Open workspace PR

# Opens or updates the pull request for bot/sync-workspace. Separate from the
# sync itself so the pull request can be reopened or re-described without
# recomputing the whole reconciliation.
#
# When the branch is ahead of main this does what the sync workflow's PR step
# does, so the two are interchangeable. Every diff merges unattended once
# Validate passes; there is no review gate left to toggle.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-workspace
  cancel-in-progress: false

jobs:
  pull-request:
    name: Open pull request
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # Minted from the App this repository already holds credentials for. The
      # coverage assertion rides along with the mint, so a partial installation
      # can never be mistaken for a set of deletions.
      #
      # contents:write to push the branch, pull_requests:write to open the pull
      # request and enable auto-merge. Asking for less than the App holds is a
      # ceiling, so this is also the whole of this job's reach.
      - name: Mint installation token
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          UMBRELLA_OWNER: ${{ github.repository_owner }}
        run: node .github/scripts/mint-installation-token.ts contents=write metadata=read pull_requests=write

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Structural is derived from the branch contents rather than taken on trust
      # from the sync run, so dispatching this workflow by hand describes the diff
      # the same way the sync would have. It no longer gates the merge.
      - name: Describe the diff and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
          UMBRELLA_OWNER: ${{ github.repository_owner }}
          UMBRELLA_REPO: ${{ github.event.repository.name }}
        run: |
          set -o pipefail
          git fetch --quiet origin bot/sync-workspace || {
            echo "bot/sync-workspace does not exist yet. Run the Sync workspace workflow first." >&2
            exit 1
          }
          ahead="$(git rev-list --count origin/main..origin/bot/sync-workspace)"
          if [ "$ahead" -eq 0 ]; then
            echo "bot/sync-workspace is not ahead of main. Run the Sync workspace workflow first."
            exit 0
          fi
          structural=false
          if git log --format=%s origin/main..origin/bot/sync-workspace | grep -q 'reconcile submodule layout'; then
            structural=true
          fi
          echo "commits ahead: $ahead, structural: $structural"
          STRUCTURAL="$structural" node .github/scripts/open-workspace-pr.ts