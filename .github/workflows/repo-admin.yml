name: Repo admin

# One entry point for the repository lifecycle operations the umbrella owns:
# archive, unarchive, privatize, publicize, rename, delete.
#
# These are all a single PATCH to /repos/{owner}/{repo} with one field in the body,
# except delete. They are exposed as one workflow with a dropdown rather than six
# workflows so there is one place where the refusals live and one place to read
# what each operation will do.
#
# Every operation that changes lifecycle or visibility changes where a repository
# belongs in the workspace, so this workflow dispatches the reconciliation itself
# whenever the layout actually moved. The resulting pull request merges once
# Validate passes, so a lifecycle operation needs no human follow-up at all.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to perform"
        type: choice
        required: true
        options:
          - archive
          - unarchive
          - privatize
          - publicize
          - rename
          - delete
      repo:
        description: "Repository name (e.g. Study)"
        type: string
        required: true
      new_name:
        description: "Required for rename: the new repository name"
        type: string
        required: false
      confirm_name:
        description: "Required for delete: retype the repository name exactly"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: repo-admin
  cancel-in-progress: false

jobs:
  admin:
    name: ${{ inputs.operation }} ${{ inputs.repo }}
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.operation.outputs.changed }}

    steps:
      # The operation script lives in this repository, so the repository has to be
      # on disk before node can run it. Every other workflow in .github/workflows
      # already does this; without it node fails with MODULE_NOT_FOUND on a path
      # that exists in the commit.
      - uses: actions/checkout@v4

      # administration:write is what PATCH and DELETE /repos require. This job
      # holds it deliberately and does nothing else, so the scope is auditable in
      # one place. Note that this is the *job's* scope; the App itself is shared
      # with the DarkFactory workflows and holds more, which is why dispatching the
      # reconciliation is a separate job below rather than a step here.
      - name: Mint GitHub App installation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # `owner` is required. Without it the action scopes the token to this
          # repository alone, and /installation/repositories then reports a single
          # repository instead of every one the App is installed on -- which the
          # validator correctly refuses to treat as authoritative.
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-metadata: read

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Refusals live in the script and exit non-zero with an explanation: a fork
      # cannot change visibility, a Pages repository cannot be privatized, and a
      # delete must be preceded by an archive and confirmed by name.
      - name: Perform operation
        id: operation
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
          UMBRELLA_OWNER: ${{ github.repository_owner }}
          UMBRELLA_REPO: ${{ github.event.repository.name }}
        run: |
          node .github/scripts/repo-admin.ts \
            "${{ inputs.operation }}" \
            "${{ inputs.repo }}" \
            "${{ inputs.operation == 'rename' && inputs.new_name || inputs.confirm_name }}"

  # Archiving, unarchiving, changing visibility or deleting all move a repository
  # to a different path in the workspace, so the layout is stale the moment the
  # operation succeeds. Dispatching the sync here rather than printing a TODO is
  # what makes the loop unattended: the operation reconciles itself.
  #
  # Split into its own job so this one mints actions:write and nothing else. The
  # job that can delete repositories should not also be the job that triggers
  # workflow runs.
  reconcile:
    name: Reconcile workspace
    needs: admin
    if: needs.admin.outputs.changed == 'true'
    runs-on: ubuntu-latest

    # Nothing here uses GITHUB_TOKEN; every call goes through the App installation
    # token below. Deny it outright rather than inheriting contents:write.
    permissions: {}

    steps:
      - name: Mint GitHub App installation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write

      - name: Dispatch the sync
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # github.repository is already "owner/repo"; prefixing the owner again
          # produces a 404 that reads like a permissions problem.
          gh api -X POST \
            "repos/${{ github.repository }}/actions/workflows/sync-workspace.yml/dispatches" \
            -f ref=main \
            --silent
          echo "Dispatched Sync workspace. It will open a pull request, which merges"
          echo "itself once Validate re-derives the expected layout and agrees."