name: Sync workspace

# Reconciles the umbrella workspace with the GitHub repository list every six
# hours, plus on demand. This workflow only computes and pushes a branch; opening
# the pull request is a separate step so the PR can be reopened without
# recomputing anything.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race over .gitmodules and the gitlink index. Without this a
# scheduled run and a manual dispatch can both be mid-write.
concurrency:
  group: sync-workspace
  cancel-in-progress: false

jobs:
  # Proves the repository list is complete before anything is allowed to remove a
  # submodule. A partial list -- an App installed on a subset -- is returned with
  # HTTP 200 and no warning, so the sync cannot infer completeness from the absence
  # of an error and must be told.
  #
  # Its own job, holding no GITHUB_TOKEN and no installation token, because it is
  # the only step that reads the private key. The sync job pushes a branch and
  # holds a write-scoped app token; the key has no business being in that job.
  scope:
    name: Assert enumeration scope
    runs-on: ubuntu-latest
    permissions: {}

    outputs:
      complete: ${{ steps.scope.outputs.complete }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assert every installation covers all repositories
        id: scope
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: node .github/scripts/assert-enumeration-complete.ts

  sync:
    name: Reconcile submodules
    needs: scope
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Pointers only. The sync never needs the submodules themselves, and
          # they are mostly private and archived, so cloning them would be slow
          # and would need credentials the job has no reason to hold.
          submodules: false

      # Read access across all repositories, to enumerate them and resolve each
      # default branch head. Deliberately not granted administration:write, so
      # this unattended job cannot archive or delete anything.
      - name: Mint GitHub App installation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # `owner` is required. Without it the action scopes the token to this
          # repository alone, and /installation/repositories then reports a single
          # repository instead of every one the App is installed on -- which the
          # validator correctly refuses to treat as authoritative.
          owner: ${{ github.repository_owner }}
          # contents:write to push the branch, pull_requests:write to open the pull
          # request. The reconcile step only reads, but the same token serves the PR
          # step below, and the token is minted once for the whole job.
          #
          # Deliberately not granted: administration. This job is unattended and
          # runs every six hours; it must not be able to archive or delete anything.
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script reports CHANGED and STRUCTURAL on stdout; both are captured as
      # step outputs so later steps can branch on them. Without these the PR step
      # would either never run or would run on a run that changed nothing.
      - name: Reconcile
        id: sync
        env:
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
          # The sync removes submodules only when the list is proven complete.
          # Passed as a conclusion, never as a key: this job cannot re-derive it.
          UMBRELLA_ENUMERATION_COMPLETE: ${{ needs.scope.outputs.complete }}
          UMBRELLA_OWNER: ${{ github.repository_owner }}
          UMBRELLA_REPO: ${{ github.event.repository.name }}
        run: |
          set -o pipefail
          output="$(node .github/scripts/sync-workspace.ts 2>&1 | tee /dev/stderr)"
          if grep -q '^CHANGED=true$' <<<"$output"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^STRUCTURAL=true$' <<<"$output"; then
            echo "structural=true" >> "$GITHUB_OUTPUT"
          else
            echo "structural=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          UMBRELLA_APP_TOKEN: ${{ steps.app.outputs.token }}
          UMBRELLA_OWNER: ${{ github.repository_owner }}
          UMBRELLA_REPO: ${{ github.event.repository.name }}
          STRUCTURAL: ${{ steps.sync.outputs.structural }}
        run: node .github/scripts/open-workspace-pr.ts

      - name: Report when nothing changed
        if: steps.sync.outputs.changed != 'true'
        run: echo "Workspace already matches GitHub; no pull request needed."